# fixpay-mobile override — run the stack on the shared tms_default ingress
# network with stable container names. All inter-service traffic uses Docker
# DNS names on tms_default (never host ports); the Traefik router forwards
# api.fixpay.test -> fixpay-api-webserver:80 and app.fixpay.test ->
# fixpay-frontend:80.

services:
  db:
    container_name: fixpay-db
    networks:
      - tms_default

  backend:
    container_name: fixpay-backend
    networks:
      - tms_default

  api_webserver:
    container_name: fixpay-api-webserver
    networks:
      - tms_default

  frontend:
    container_name: fixpay-frontend
    networks:
      - tms_default
    ports:
      # Host-browser escape hatch for the PWA (ingress: app.fixpay.test).
      # 8081 is payfixy-frontend; 8082 is the fixpay PWA.
      - "8082:80"

  # The worker itself is defined in the base file (so deployments get it too);
  # this override only gives it a stable name + the ingress network.
  queue-worker:
    container_name: fixpay-queue-worker
    networks:
      - tms_default

networks:
  tms_default:
    external: true
